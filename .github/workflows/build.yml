name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FloatDock-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/*.apk FloatDock.apk
          gh release create v1.0 FloatDock.apk --title "FloatDock" --notes "FloatDock APK" --repo ${{ github.repository }} || gh release upload v1.0 FloatDock.apk --clobber --repo ${{ github.repository }}
